# Lint, unit tests, database tests against a throwaway PostGIS, and an image build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gras
          POSTGRES_PASSWORD: gras_test
          POSTGRES_DB: gras_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gras -d gras_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gras:gras_test@localhost:5432/gras_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f app/Dockerfile -t gras-app .

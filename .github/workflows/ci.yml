# Lint, unit tests, database tests against a throwaway PostGIS, and an image build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gras
          POSTGRES_PASSWORD: gras_test
          POSTGRES_DB: gras_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gras -d gras_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gras:gras_test@localhost:5432/gras_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f app/Dockerfile -t gras-app .

  # Start the whole stack the way a reviewer would, from a clean checkout and
  # without an Earth Engine key, and check the dashboard comes up with results.
  reviewer-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up with only the example settings
        run: |
          cp .env.example .env
          mkdir -p secrets
          docker compose up -d --build
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy ] && break
            sleep 5
          done
          curl -fsS http://localhost:8501/_stcore/health
          test "$(docker compose exec -T db psql -U gras -d gras -At -c 'SELECT COUNT(*) FROM v_stats')" = 172
      - if: always()
        run: docker compose logs app | tail -40
